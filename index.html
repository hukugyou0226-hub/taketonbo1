<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竹とんぼ</title>
<style>
:root{--bg:#e9d9b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2418}}
:root[data-theme="dark"]{--bg:#2b2418}
html,body{margin:0;height:100%}
body{background:var(--bg);display:flex;justify-content:center;align-items:center;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
canvas{max-width:100%;max-height:100%;aspect-ratio:360/520;touch-action:none;border-radius:10px;box-shadow:0 2px 12px #0005}
</style></head><body>
<canvas id="c" width="360" height="520"></canvas>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),W=360,H=520;
let G={},best=0,over=false,title=true,last=0,t=0,ph0=Math.random()*6;
try{best=+localStorage.getItem('takeKazeOrig')||0}catch(e){}
function T(s,px,py,sz,col,al){x.font='bold '+sz+'px sans-serif';x.fillStyle=col||'#4a3520';x.textAlign=al||'center';x.textBaseline='middle';x.fillText(s,px,py)}
function R(px,py,w,h,col,r){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r||8);x.fill()}
function paper(){x.fillStyle='#f4e6c8';x.fillRect(0,0,W,H);x.fillStyle='#e6d2a4';for(let i=0;i<H;i+=26)x.fillRect(0,i,W,2)}
const wind=()=>Math.max(-3,Math.min(3,2.4*Math.sin(t*1.2+ph0)+.8*Math.sin(t*3.5)));
function quitGame(){G.hold=false;G.fly=null;over=false;title=true}
function init(){over=false;title=false;G={tries:1,total:0,quit:false,ph:'ready',p:0,dir:1,hold:false,fly:null,wait:0,w:0,fw:0,msg:'おして ためて、はなして とばす'}}
function update(d){t+=d;if(title)return;
if(G.ph=='ready')G.w=wind();
if(G.hold){G.p+=G.dir*d*1.2;if(G.p>1){G.p=1;G.dir=-1}if(G.p<0){G.p=0;G.dir=1}}
const F=G.fly;
if(F&&!F.done){F.t+=d;if(F.t>=F.T){F.t=F.T;F.done=true;G.total+=F.d;G.tries--;G.msg=F.d+(F.bonus?'m フワッと のびた!':'m とんだ!');G.ph='res';G.wait=1.4}}
else if(G.ph=='res'){G.wait-=d;if(G.wait<=0){if(G.tries<=0){if(G.total>best){best=G.total;try{localStorage.setItem('takeKazeOrig',best)}catch(e){}}over=true}else{G.ph='ready';G.fly=null;G.p=0;G.msg='もう いっかい!'}}}}
// 飛行: 長く滑空しながら背景が流れる。追い風に乗ると1度フワッと浮く
function fl(){const F=G.fly,u=F.t/F.T,e=1-Math.pow(1-u,1.25),sc=Math.min(1,u*3);
let h=F.H*Math.sin(Math.PI*Math.pow(u,.6))+Math.sin(u*40)*3*(1-u)*(u>.3?1:0),fu=0,bs=0;
if(F.lift){const k=Math.max(0,Math.min(1,(u-.4)/.55));bs=k*k*(3-2*k);const k2=Math.max(0,Math.min(1,(u-.45)/.22));if(u>.45&&u<.67){fu=Math.sin(Math.PI*k2);h+=F.lift*fu}}
// X = スタートからの実際の距離(m)。メーターの数字も背景の目盛りも、この値だけを基準にする
const X=F.base*e+F.bonus*bs,px=50+Math.min(X*14,130*(sc*sc*(3-2*sc)));
return{u,cam:X*14-(px-50),px,py:Math.max(60,380-h),fu,m:Math.round(X),h}}
function scene(cam){
let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7ec8f0');g.addColorStop(1,'#d8f0ff');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#fff';x.globalAlpha=.85;
for(let i=0;i<5;i++){const cx=((i*170-cam*.15)%850+850)%850-100,cy=190+(i*47)%150;x.beginPath();x.ellipse(cx,cy,38,14,0,0,7);x.ellipse(cx+22,cy-8,26,14,0,0,7);x.fill()}x.globalAlpha=1;
x.fillStyle='#9fd88a';for(let i=0;i<6;i++){const hx=((i*200-cam*.4)%1200+1200)%1200-150;x.beginPath();x.arc(hx,400,90+i%2*30,Math.PI,0);x.fill()}
x.fillStyle='#6bb04a';x.fillRect(0,400,W,120);
x.fillStyle='#5aa03c';for(let i=0;i<14;i++){const gx=((i*53-cam)%742+742)%742-40;x.fillRect(gx,430+(i%3)*22,24,4)}
for(let i=0;i<6;i++){const tx=((i*160-cam)%960+960)%960-60;x.fillStyle='#7a4a1c';x.fillRect(tx-3,372,6,28);x.fillStyle='#4f9a3c';x.beginPath();x.arc(tx,362,17,0,7);x.fill()}
for(let m=0;m<=200;m+=10){const sx=50+m*14-cam;if(sx>-30&&sx<390){x.fillStyle='#fff';x.fillRect(sx-1.5,384,3,18);T(m?m+'m':'START',sx,374,11,'#2b3a4a')}}}
function draw(){
if(title){paper();T('竹とんぼ',180,150,52,'#7a4a1c');T('かぜを よんで とばそう',180,205,18,'#7a6040');T('ベスト '+best+'m',180,260,20);R(80,310,200,56,'#e63946',14);T('あそぶ',180,338,24,'#fff');return}
if(over){paper();T('おしまい!',180,130,36);T('竹とんぼ',180,185,22,'#7a6040');T(G.total+'m',180,250,56,'#c0392b');
T(G.total>=best&&G.total>0?'ベスト こうしん!':'ベスト '+best+'m',180,300,18);R(80,340,200,52,'#e63946',14);T('もういちど',180,366,22,'#fff');R(80,410,200,52,'#8a6a40',14);T('やめる',180,436,22,'#fff');return}
let px=50,py=380,rot=G.hold?performance.now()/30:0,F=G.fly,s=null;
if(F){s=fl();px=s.px;py=s.py;rot=performance.now()/(s.fu>0?12:20)}
scene(s?s.cam:0);
const w=G.ph=='ready'?G.w:G.fw,a=Math.abs(w);
if(a>.3){x.strokeStyle='#fff';x.globalAlpha=.6;x.lineWidth=2;const sp=Math.sign(w)*(40+a*70);
for(let i=0;i<8+a*4;i++){const sx=((i*97+t*sp)%420+420)%420-30,sy=(i*61)%240+160,len=16+a*8;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+len,sy);x.stroke()}x.globalAlpha=1}
const hh=s?s.h:0;x.fillStyle='#0003';x.beginPath();x.ellipse(px,408,Math.max(6,18-hh/14),4,0,0,7);x.fill();
if(s&&s.fu>0){x.fillStyle='#fff';x.globalAlpha=.8*s.fu;for(let i=0;i<6;i++){const an=i*1.05+t*3,r=22+10*Math.sin(t*6+i);x.beginPath();x.arc(px+Math.cos(an)*r,py+14+Math.sin(an)*r*.6,4+i%3,0,7);x.fill()}x.globalAlpha=1;T('フワッ!',px,py-34-s.fu*8,20,'#fff')}
x.strokeStyle='#7a4a1c';x.lineWidth=5;x.beginPath();x.moveTo(px,py);x.lineTo(px,py+32);x.stroke();
x.strokeStyle='#d9a441';x.lineWidth=7;x.beginPath();let ww=28*Math.cos(rot);x.moveTo(px-ww,py);x.lineTo(px+ww,py);x.stroke();
R(10,12,76,32,'#fff9',10);T('やめる',48,28,16,'#c0392b');T('1回しょうぶ!',215,28,20,'#2b3a4a');T(G.msg,180,90,18,'#2b3a4a');
const n=Math.round(a),lab=a<.5?'ほぼ むふう':(w>0?'おいかぜ '+'→'.repeat(n):'むかいかぜ '+'←'.repeat(n));
R(70,112,220,30,'#fff8',10);T('かぜ  '+lab,180,127,16,w>.5?'#2e8b57':w<-.5?'#c0392b':'#2b3a4a');
if(G.ph=='ready')T(G.w>=1?'おいかぜ! みどりで はなすと フワッと のびる':'はなす しゅんかんの かぜが のるよ',180,160,13,'#2b3a4a');
else if(s)T(s.m+'m',180,175,34,'#2b3a4a');
R(40,440,280,22,'#fff8',8);R(40+280*.7,440,280*.2,22,'#4caf50',4);R(40+280*G.p-4,434,8,34,'#c0392b',3);
T('みどりの ところで はなすと よく とぶ',180,490,14,'#2b3a4a')}
function loop(ts){const d=Math.min(.05,(ts-last)/1000||0);last=ts;update(d);draw();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
function pos(e){let r=C.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
C.addEventListener('pointerdown',e=>{let p=pos(e);C.setPointerCapture(e.pointerId);
if(title){if(p[0]>80&&p[0]<280&&p[1]>310&&p[1]<366)init();return}
if(over){if(p[0]>80&&p[0]<280){if(p[1]>340&&p[1]<392)init();else if(p[1]>410&&p[1]<462)title=true}return}
if(p[0]<92&&p[1]<50){quitGame();return}
if(G.ph=='ready'){G.hold=true;G.p=0;G.dir=1}});
function up(){if(over||!G.hold)return;G.hold=false;let q=Math.max(.1,1-Math.abs(G.p-.8)*2.4);G.fw=G.w;
// 基本の距離=タイミング(最大70m) × 風(むかい0.55倍〜おいかぜ1.45倍)
const base=Math.max(4,Math.round(q*70*(1+.15*G.fw)+Math.random()*6-3));
// おいかぜ(1以上)に乗ると フワッ で追加でぐんと伸びる(タイミングがいいほど大きい)
const bonus=G.fw>=1?Math.round((12+10*G.fw)*(.4+.6*q)):0,d=base+bonus;
G.fly={t:0,base,bonus,d,T:3+d/40,H:Math.min(230,100+base*1.4),lift:G.fw>=1?45+22*G.fw:0,done:false};G.ph='fly'}
['pointerup','pointercancel'].forEach(n=>C.addEventListener(n,up));
</script></body></html>
